name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  tauri:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            install: >-
              sudo apt-get install -y
              libwebkit2gtk-4.1-dev
              librsvg2-dev
              libayatana-appindicator3-dev
              libssl-dev
              libglib2.0-dev
              pkg-config
            target: ''
          - platform: macos-latest
            install: ''
            target: aarch64-apple-darwin
          - platform: windows-latest
            install: ''
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust
        shell: bash
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install stable --profile minimal --no-self-update
          # only add cross targets; the host target ships with the stable toolchain
          if [ -n "${{ matrix.target }}" ]; then
            rustup target add --toolchain stable ${{ matrix.target }}
          fi
          # make cargo/rustc visible to later steps (npx tauri build spawns them)
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install frontend deps
        run: npm ci

      - name: Rust platform install
        if: matrix.install != ''
        shell: bash
        run: |
          # refresh apt index; runner's cached metadata points at 404 mirrors
          sudo apt-get update
          ${{ matrix.install }}

      - name: Build & release
        run: npx tauri build --ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
