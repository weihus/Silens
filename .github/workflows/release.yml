name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  tauri:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: ''
            upload: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/appimage/*.sig
              src-tauri/target/release/bundle/deb/*.deb
          - platform: macos-latest
            target: aarch64-apple-darwin
            upload: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app.tar.gz
              src-tauri/target/release/bundle/macos/*.sig
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            upload: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/msi/*.sig
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/nsis/*.sig

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify release configuration
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Configure TAURI_SIGNING_PRIVATE_KEY in repository secrets'; exit 1; }
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json'));
          const pkg = JSON.parse(fs.readFileSync('package.json'));
          const cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8').match(/^version = "([^"]+)"/m)?.[1];
          if (process.env.GITHUB_REF_NAME !== `v${config.version}` || pkg.version !== config.version || cargo !== config.version) {
            throw new Error('Release tag, package version and Tauri version must match');
          }
          NODE

      - name: Install Rust
        shell: bash
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install stable --profile minimal --no-self-update
          if [ -n "${{ matrix.target }}" ]; then
            rustup target add --toolchain stable ${{ matrix.target }}
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev libglib2.0-dev pkg-config

      - name: Build signed installers and update artifacts
        run: npx tauri build --ci
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          while IFS= read -r pattern; do
            [ -z "$pattern" ] && continue
            for file in $pattern; do
              [ -e "$file" ] || continue
              cp "$file" artifacts/
            done
          done <<'PATTERNS'
          ${{ matrix.upload }}
          PATTERNS

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}
          path: artifacts/
          if-no-files-found: error

  publish:
    name: Publish signed release
    runs-on: ubuntu-latest
    needs: tauri
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: uploads
          merge-multiple: true

      - name: Generate release notes and update manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" --jq .body > release-notes.txt
          node scripts/create-update-manifest.mjs uploads "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" release-notes.txt

      - name: Publish all platforms together
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true || {
              echo 'A published release already exists; publish a new version instead of replacing signed assets.'
              exit 1
            }
            gh release upload "$GITHUB_REF_NAME" uploads/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" uploads/* --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "Silens $GITHUB_REF_NAME" --notes-file release-notes.txt
          fi
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
