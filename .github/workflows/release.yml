name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  tauri:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            install: >-
              sudo apt-get install -y
              libwebkit2gtk-4.1-dev
              librsvg2-dev
              libayatana-appindicator3-dev
              libssl-dev
              libglib2.0-dev
              pkg-config
            target: ''
            upload: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
          - platform: macos-latest
            install: ''
            target: aarch64-apple-darwin
            upload: |
              src-tauri/target/release/bundle/dmg/*.dmg
          - platform: windows-latest
            install: ''
            target: x86_64-pc-windows-msvc
            upload: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust
        shell: bash
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install stable --profile minimal --no-self-update
          # only add cross targets; the host target ships with the stable toolchain
          if [ -n "${{ matrix.target }}" ]; then
            rustup target add --toolchain stable ${{ matrix.target }}
          fi
          # make cargo/rustc visible to later steps (npx tauri build spawns them)
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install frontend deps
        run: npm ci

      - name: Rust platform install
        if: matrix.install != ''
        shell: bash
        run: |
          # refresh apt index; runner's cached metadata points at 404 mirrors
          sudo apt-get update
          ${{ matrix.install }}

      - name: Build & release
        run: npx tauri build --ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        if: matrix.upload != ''
        shell: bash
        run: |
          # copy the files matched by each glob into ./artifacts/ for upload
          mkdir -p artifacts
          while IFS= read -r pat; do
            [ -z "$pat" ] && continue
            for f in $pat; do
              [ -e "$f" ] || continue
              echo "collecting $f"
              cp "$f" artifacts/
            done
          done <<EOF
          ${{ matrix.upload }}
          EOF
          ls -la artifacts/
        id: collect

      - name: Push artifacts to workflow artifact store
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}
          path: artifacts/
          if-no-files-found: error

  publish:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: tauri
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: builds

      - name: Create release with assets
        shell: bash
        run: |
          # gather every platform artifact into a single uploads directory
          mkdir -p uploads
          find builds -type f | while IFS= read -r f; do
            cp "$f" uploads/
          done
          ls -la uploads/
          if [ -z "$(ls -A uploads/ 2>/dev/null)" ]; then
            echo "no artifacts to publish"; exit 1
          fi
          # delete an existing release for this tag so re-runs are idempotent
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release delete "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --cleanup-tag
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" --notes "" \
            uploads/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
